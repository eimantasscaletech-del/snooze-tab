<!DOCTYPE html>
<html>
<head>
	<meta charset="UTF-8" />
	<meta name="viewport" content="width=device-width, initial-scale=1.0" />
	<title>Forget till</title>
	<link rel="stylesheet" href="../styles/common.css" />
	<link rel="stylesheet" href="../styles/checkbox.css" />
	<link rel="stylesheet" href="../styles/popup.css" />
	<link rel="stylesheet" href="../styles/flatpickr.css" />
</head>
<body>
	<div class="popup-tabs flex" role="tablist" aria-label="Popup sections">
		<button class="popup-tab active" id="snooze-tab-button" type="button" role="tab" aria-selected="true" aria-controls="snooze-panel" data-panel="snooze-panel">Snooze</button>
		<button class="popup-tab" id="habitica-tab-button" type="button" role="tab" aria-selected="false" aria-controls="habitica-panel" data-panel="habitica-panel">Habitica</button>
		<button class="popup-tab" id="bookmarks-tab-button" type="button" role="tab" aria-selected="false" aria-controls="bookmarks-panel" data-panel="bookmarks-panel">Bookmarks</button>
		<span id="popup-clock" class="popup-clock"></span>
	</div>

	<div id="snooze-panel" class="popup-panel active" role="tabpanel" aria-labelledby="snooze-tab-button">
		<h3 class="center panel-title">Wanna Snooz?</h3>
		<div class="flex header">
			<div id="targets" class="flex">
				<div id="tab" class="target disabled"><span>This Tab</span></div>
				<div id="window" class="target disabled"><span>Window</span></div>
				<div id="selection" class="target disabled"><span>Selected</span></div>
				<div id="group" class="target disabled"><span>Group</span></div>
			</div>
			<div id="preview" class="flex">
				<img id="preview-favicon" src="../icons/unknown.png"><div id="preview-text">¿ ?</div>
			</div>
		</div>
		<h3 class="center">When?</h3>
		<div class="section choices">
			<div class="form-overlay">
				<span class="overlay-close-btn">&times;</span>
				<div class="repeat-container hidden">
					<div class="repeat-section">
						<div class="repeat-interval-picker flex">
							<div data-type="weekly" class="repeat-interval active">Weekly</div>
							<div data-type="monthly" class="repeat-interval">Monthly</div>
						</div>
						<div class="repeat-week-wrapper r-section"><div></div></div>
						<div class="repeat-month-wrapper r-section hidden"><div id="monthly"></div></div>
					</div>
					<div class="repeat-time-wrapper">
						<div id="repeat-time"></div>
						<div class="flex reset-container"><div class="reset-action">Reset</div></div>
						<div class="quick-actions">
							<h3 class="center">Quick Actions</h3>
							<div class="flex">
								<div class="action" data-value="morning">Morning</div>
								<div class="action" data-value="now">Now</div>
								<div class="action" data-value="evening">Evening</div>
							</div>
						</div>
						<h3>Next Wakeup</h3>
						<div id="next-wakeup">-</div>
					</div>
				</div>
				<div class="date-wrapper"><div id="date"></div></div>
				<div class="time-wrapper">
					<div id="time"></div>
					<div class="flex reset-container"><div class="reset-action">Reset</div></div>
					<div class="quick-actions">
						<h3 class="center">Quick Actions</h3>
						<div class="flex">
							<div class="action" data-value="5">+5 mins</div>
							<div class="action" data-value="60">+1 hour</div>
							<div class="action" data-value="1440">+1 day</div>
						</div>
						<div class="flex">
							<div class="action" data-value="-5">-5 mins</div>
							<div class="action" data-value="-60">-1 hour</div>
							<div class="action" data-value="-1440">-1 day</div>
						</div>
					</div>
				</div>
			</div>
		</div>
		<div class="section special-choices">
			<div class="repeat-choice-overlay flex">
				<div class="repeat-choice flex">
					<label class="checkbox path popup-checkbox flex">
						<input id="repeat" type="checkbox" tabindex="0">
						<svg viewBox="0 0 21 21">
							<path d="M5 10.75 8.5 14.25 19.4 2.3C18.83 1.43 18.03 1 17 1L4 1C2.35 1 1 2.35 1 4L1 17C1 18.65 2.35 20 4 20L17 20C18.65 20 20 18.65 20 17L20 7.99"></path>
						</svg>
						<span>Repeat ?</span>
					</label>
				</div>
			</div>
		</div>
		<div class="footer flex">
			<div class="flex">
				<div class="center"><img id="icon" src="../icons/logo.svg"></div>
				<div class="empty"><img src="../icons/transparent.png"></div>
			</div>
			<div>
				<a><span tabindex="0" class="nap-room-btn" data-href="/html/nap-room.html">See Sleeping Tabs</span></a>
				<span class="upcoming" data-today=""></span>
			</div>
			<div class="flex">
				<div class="keyboard show" tabindex="0"><img src="../icons/keyboard.png"></div>
				<div class="shortcut-overlay"><div class="shortcuts"><div class="borders"></div><div class="keys"></div></div></div>
				<div class="settings" tabindex="0" data-href="/html/settings.html" data-hover="Settings">
					<img data-href="/html/settings.html" src="../icons/settings.png">
				</div>
			</div>
		</div>
	</div>

	<div id="habitica-panel" class="popup-panel" role="tabpanel" aria-labelledby="habitica-tab-button" hidden>
		<h3 class="center panel-title">Habitica</h3>
		<div id="habitica-credentials-form" class="habitica-panel-card">
			<div class="habitica-badge">Setup</div>
			<h2>Connect Habitica</h2>
			<div class="habitica-field">
				<label for="habitica-user-id">Habitica User ID</label>
				<input id="habitica-user-id" type="text" placeholder="xxxxxxxx-xxxx-xxxx-xxxx-xxxxxxxxxxxx" autocomplete="off" spellcheck="false" />
			</div>
			<div class="habitica-field">
				<label for="habitica-api-token">Habitica API Token</label>
				<input id="habitica-api-token" type="password" placeholder="xxxxxxxx-xxxx-xxxx-xxxx-xxxxxxxxxxxx" autocomplete="off" />
			</div>
			<div class="habitica-form-actions">
				<button id="habitica-save-btn" type="button">Save &amp; Load Tasks</button>
				<span id="habitica-error" class="habitica-error"></span>
			</div>
		</div>
		<div id="habitica-tasks-view" class="habitica-tasks-view hidden">
			<div class="habitica-tasks-header">
				<span id="habitica-tasks-count"></span>
				<button id="habitica-disconnect-btn" type="button" class="habitica-disconnect-btn" title="Disconnect">&#x2715; Disconnect</button>
			</div>
			<div id="habitica-tasks-list" class="habitica-tasks-list"></div>
		</div>
		<div id="pomodoro-bar" class="pomodoro-bar hidden">
			<div class="pomodoro-task-label" id="pomodoro-task-label"></div>
			<div class="pomodoro-controls">
				<span id="pomodoro-time" class="pomodoro-time">25:00</span>
				<button id="pomodoro-start-btn" class="pomodoro-btn" type="button">&#9654;</button>
				<button id="pomodoro-reset-btn" class="pomodoro-btn" type="button">&#8635;</button>
				<button id="pomodoro-close-btn" class="pomodoro-btn pomodoro-close" type="button">&times;</button>
			</div>
		</div>
	</div>

	<div id="bookmarks-panel" class="popup-panel" role="tabpanel" aria-labelledby="bookmarks-tab-button" hidden>
		<div class="bookmarks-header">
			<button id="bookmark-add-btn" type="button" class="bookmark-add-btn">+ Add Current Tab</button>
			<span class="bookmarks-hint">Open with Ctrl+Alt+Cmd+[1–9,0]</span>
		</div>
		<div id="bookmarks-list" class="bookmarks-list"></div>
	</div>
	<script type="text/javascript" src="../scripts/dayjs.min.js"></script>
	<script type="text/javascript" src="../scripts/flatpickr.min.js"></script>
	<script type="text/javascript" src="../scripts/gradient.min.js"></script>
	<script type="text/javascript" src="../scripts/common.js"></script>
	<script type="text/javascript" src="../scripts/popup.js"></script>
</body>
</html>
