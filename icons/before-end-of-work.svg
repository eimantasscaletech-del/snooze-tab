<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
    <defs>
        <linearGradient id="eowGradient" gradientUnits="userSpaceOnUse" x1="50%" y1="0%" x2="50%" y2="100%">
            <stop offset="0%" stop-color="#f2b745"/>
            <stop offset="100%" stop-color="#df4e75"/>
        </linearGradient>
    </defs>
    <!-- Briefcase handle -->
    <path d="M19 28 L19 22 Q19 17 24 17 L34 17 Q39 17 39 22 L39 28" fill="none" stroke="url(#eowGradient)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- Briefcase body -->
    <rect x="6" y="28" width="44" height="28" rx="4" ry="4" fill="none" stroke="url(#eowGradient)" stroke-width="3"/>
    <!-- Horizontal band -->
    <line x1="6" y1="40" x2="50" y2="40" stroke="url(#eowGradient)" stroke-width="2"/>
    <!-- Clasp -->
    <rect x="25" y="35" width="6" height="10" rx="2" fill="none" stroke="url(#eowGradient)" stroke-width="2"/>
    <!-- Clock showing 5:00 (end of work) -->
    <circle cx="50" cy="14" r="10" fill="#fff" stroke="url(#eowGradient)" stroke-width="2"/>
    <!-- Minute hand pointing to 12 -->
    <line x1="50" y1="14" x2="50" y2="8" stroke="url(#eowGradient)" stroke-width="1.5" stroke-linecap="round"/>
    <!-- Hour hand pointing to 5 o'clock -->
    <line x1="50" y1="14" x2="52.5" y2="18.3" stroke="url(#eowGradient)" stroke-width="1.5" stroke-linecap="round"/>
</svg>
