<svg width="128" height="128" viewBox="0 0 128 128" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="card" cx="50%" cy="38%" r="70%">
      <stop offset="0%" stop-color="#2a2a2a" />
      <stop offset="100%" stop-color="#111111" />
    </radialGradient>
    <linearGradient id="yellowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFD700" />
      <stop offset="100%" stop-color="#F5A800" />
    </linearGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="0" stdDeviation="4" flood-color="#FFD700" flood-opacity="0.5" />
    </filter>
  </defs>

  <!-- Card background -->
  <rect x="4" y="4" width="120" height="120" rx="22" ry="22" fill="url(#card)" />
  <rect x="4" y="4" width="120" height="120" rx="22" ry="22" fill="none" stroke="#FFD700" stroke-width="2.5" opacity="0.7" />

  <!-- Dragon motif: stylized fist/strike silhouette -->
  <!-- Body of fist -->
  <g filter="url(#glow)" fill="url(#yellowGrad)">
    <!-- Knuckle row -->
    <rect x="36" y="46" width="56" height="30" rx="8" />
    <!-- Thumb -->
    <rect x="28" y="54" width="18" height="16" rx="7" />
    <!-- Fingers top ridge -->
    <rect x="38" y="38" width="11" height="14" rx="5" />
    <rect x="52" y="35" width="11" height="17" rx="5" />
    <rect x="66" y="36" width="11" height="16" rx="5" />
    <rect x="79" y="40" width="10" height="13" rx="5" />
  </g>

  <!-- Strike lines (motion) -->
  <line x1="16" y1="44" x2="34" y2="52" stroke="#FFD700" stroke-width="2.5" stroke-linecap="round" opacity="0.6"/>
  <line x1="14" y1="55" x2="28" y2="58" stroke="#FFD700" stroke-width="2" stroke-linecap="round" opacity="0.4"/>
  <line x1="17" y1="65" x2="28" y2="64" stroke="#FFD700" stroke-width="1.5" stroke-linecap="round" opacity="0.3"/>

  <!-- Timer text -->
  <text x="64" y="104" text-anchor="middle" font-family="'Arial Black', Verdana, sans-serif" font-weight="900" font-size="18" fill="#FFD700" letter-spacing="1" opacity="0.95">25:00</text>
</svg>
